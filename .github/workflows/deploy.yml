name: Deploy BADAWI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: badawifour-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: fc4e3cff0d309c38af2b474345379804
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 2; }

      - name: Check custom-domain permission
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --output /tmp/routes.json --write-out "%{http_code}"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/workers/routes")"
          if [ "$http_code" = "403" ]; then
            echo "::error::Cloudflare API token is missing Zone > Workers Routes > Write for badawifour.com."
            exit 3
          fi
          if [ "$http_code" -ge 400 ]; then
            cat /tmp/routes.json
            echo "::error::Unable to access BADAWI Worker routes (HTTP $http_code)."
            exit 3
          fi

      - name: Install deployment tooling
        run: npm ci --no-audit --no-fund

      - name: Build and test
        run: npm run check

      - name: Provision D1 if needed
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          if ! node -e "const x=require('/tmp/d1.json'); const a=Array.isArray(x)?x:(x.result||x.databases||[]); process.exit(a.some(v=>(v.name||v.database_name)==='badawifour-prod')?0:1)"; then
            npx wrangler d1 create badawifour-prod
            npx wrangler d1 list --json > /tmp/d1.json
          fi

      - name: Provision private R2 bucket if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket info badawifour-private-uploads --json > /tmp/r2.json 2>/tmp/r2-error.log; then
            echo "R2 bucket does not exist yet; creating it."
            npx wrangler r2 bucket create badawifour-private-uploads
            npx wrangler r2 bucket info badawifour-private-uploads --json > /tmp/r2.json
          fi
          node -e "const x=require('/tmp/r2.json'); const n=x.name||x.bucket_name||x.result?.name||x.result?.bucket_name; if(n!=='badawifour-private-uploads') process.exit(1)"

      - name: Prepare BADAWI custom domains
        shell: bash
        run: |
          set -euo pipefail

          curl_cf() {
            curl --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$@"
          }

          # Read any Worker custom domains already attached. This prevents us from
          # deleting Cloudflare-managed DNS records on subsequent deployments.
          curl_cf "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > /tmp/worker-domains.json
          node -e "const x=require('/tmp/worker-domains.json'); if(x.success===false){console.error(x.errors);process.exit(1)}"

          for host in badawifour.com www.badawifour.com; do
            attached="$(HOST="$host" node -e "const x=require('/tmp/worker-domains.json'); const a=x.result||[]; process.stdout.write(a.some(v=>v.hostname===process.env.HOST&&v.service==='badawifour-com')?'yes':'no')")"
            if [ "$attached" = "yes" ]; then
              echo "$host is already attached to badawifour-com; keeping Worker-managed DNS."
              continue
            fi

            # Cloudflare Custom Domains cannot take over a hostname while an
            # external A/AAAA/CNAME record exists. Remove only legacy web-origin
            # records for the two hostnames we are replacing. MX/TXT/CAA and all
            # other DNS records are deliberately preserved.
            encoded_host="$(HOST="$host" node -p "encodeURIComponent(process.env.HOST)")"
            http_code="$(curl --silent --show-error --output /tmp/dns.json --write-out "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$encoded_host&per_page=100")"

            if [ "$http_code" = "403" ]; then
              echo "::error::Cloudflare API token needs Zone > DNS > Edit for badawifour.com so the legacy web records can be replaced safely."
              exit 4
            fi
            if [ "$http_code" -ge 400 ]; then
              cat /tmp/dns.json
              echo "::error::Unable to inspect DNS for $host (HTTP $http_code)."
              exit 4
            fi

            mapfile -t ids < <(node -e "const x=require('/tmp/dns.json'); const types=new Set(['A','AAAA','CNAME']); for(const r of (x.result||[])) if(types.has(r.type)) console.log(r.id)")
            if [ "${#ids[@]}" -eq 0 ]; then
              echo "No conflicting legacy web record found for $host."
              continue
            fi

            for id in "${ids[@]}"; do
              echo "Removing legacy web DNS record $id for $host"
              del_code="$(curl --silent --show-error --output /tmp/dns-delete.json --write-out "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/dns_records/$id")"
              if [ "$del_code" -ge 400 ]; then
                cat /tmp/dns-delete.json
                echo "::error::Unable to remove legacy web DNS record for $host (HTTP $del_code)."
                exit 4
              fi
            done
          done

      - name: Generate production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          node scripts/make-production-config.mjs /tmp/d1.json

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply badawifour-prod --remote --config wrangler.deploy.json

      - name: Deploy Worker and custom domains
        run: npx wrangler deploy --config wrangler.deploy.json

      - name: Reconcile Worker runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json --config wrangler.deploy.json > /tmp/worker-secrets.json

          if ! node -e "const x=require('/tmp/worker-secrets.json'); process.exit(x.some(v=>v.name==='RATE_LIMIT_SALT')?0:1)"; then
            echo "Creating RATE_LIMIT_SALT for the first time."
            node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))" | npx wrangler secret put RATE_LIMIT_SALT --config wrangler.deploy.json
          else
            echo "RATE_LIMIT_SALT already exists; preserving it."
          fi

          if node -e "const x=require('/tmp/worker-secrets.json'); process.exit(x.some(v=>v.name==='CLOUDFLARE_API_TOKEN')?0:1)"; then
            echo "Removing accidental deployment credential from Worker runtime."
            printf '%s\n' '{"CLOUDFLARE_API_TOKEN":null}' > /tmp/remove-runtime-secret.json
            npx wrangler secret bulk /tmp/remove-runtime-secret.json --config wrangler.deploy.json
          fi

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          health_ok=0
          for i in {1..18}; do
            if curl --fail --silent --show-error --max-time 15 https://badawifour.com/api/health > /tmp/health.json; then
              health_ok=1
              break
            fi
            sleep 5
          done
          test "$health_ok" -eq 1 || { echo "::error::Production health endpoint never became reachable."; exit 1; }
          node -e "const x=require('/tmp/health.json'); if(!x.ok||!x.db_bound||!x.uploads_bound) process.exit(1)"

          check_url() {
            local url="$1"
            for i in {1..6}; do
              if curl --fail --silent --show-error --max-time 20 "$url" > /dev/null; then
                echo "Verified $url"
                return 0
              fi
              sleep 3
            done
            echo "::error::Production URL failed verification: $url"
            return 1
          }

          for path in /fr/ /ar/ /en/ /fr/products/ /fr/products/bf65inoxp/ /ar/products/bf65cinox/ /en/products/bf65cinox/ /fr/products/bf65cinox/ /products/v1/bf65cinox/bf65cinox-320.webp /products/v1/bf65cinox/bf65cinox-640.webp /products/v1/bf65cinox/bf65cinox-960.webp /products/v1/bf65cinox/bf65cinox-1122.webp /fr/support/guides/before-installation/ /sitemap.xml /manifest.webmanifest /favicon.svg /favicon.ico /apple-touch-icon.png /brand/v1/badawi-four-logo.svg /brand/v1/badawi-four-logo-reversed.svg /brand/v1/badawi-four-lockup.svg /brand/v1/android-chrome-192x192.png /brand/v1/android-chrome-512x512.png /brand/v1/maskable-icon-512x512-dark-bg.png /.well-known/security.txt; do
            check_url "https://badawifour.com$path"
          done

          check_asset_headers() {
            local path="$1"
            local expected_type="$2"
            local expected_cache="$3"
            curl --fail --silent --show-error --head --max-time 20 "https://badawifour.com$path" > /tmp/asset-headers.txt
            grep -Eqi "^content-type: ${expected_type}" /tmp/asset-headers.txt
            grep -Eqi "^cache-control: ${expected_cache}" /tmp/asset-headers.txt
          }

          check_asset_headers /favicon.svg 'image/svg\+xml' 'public, max-age=86400'
          check_asset_headers /favicon.ico 'image/(x-icon|vnd\.microsoft\.icon)' 'public, max-age=86400'
          check_asset_headers /apple-touch-icon.png 'image/png' 'public, max-age=86400'
          check_asset_headers /brand/v1/badawi-four-logo.svg 'image/svg\+xml' 'public, max-age=31536000, immutable'
          check_asset_headers /brand/v1/android-chrome-192x192.png 'image/png' 'public, max-age=31536000, immutable'
          check_asset_headers /products/v1/bf65cinox/bf65cinox-1122.webp 'image/webp' 'public, max-age=31536000, immutable'

          curl --fail --silent --show-error --max-time 20 https://badawifour.com/manifest.webmanifest > /tmp/manifest.json
          node -e "const x=require('/tmp/manifest.json'); if(x.name!=='BADAWI FOUR'||!x.icons?.some(v=>v.purpose==='maskable')) process.exit(1)"

          curl --fail --silent --show-error --max-time 20 https://badawifour.com/fr/ > /tmp/home.html
          grep -q '/brand/v1/badawi-four-lockup.svg' /tmp/home.html
          grep -q 'https://badawifour.com/brand/v1/badawi-four-logo.svg' /tmp/home.html

          for slug in bf65inoxp bf65cinox; do
            retailer_ok=0
            for i in {1..6}; do
              if curl --fail --silent --show-error --max-time 20 "https://badawifour.com/api/retailer/$slug" > "/tmp/retailer-$slug.json" && SLUG="$slug" node -e "const x=require('/tmp/retailer-'+process.env.SLUG+'.json'); if(x.source!=='Digitronics'||x.slug!==process.env.SLUG||!['in_stock','on_order','out_of_stock','unknown'].includes(x.availability)) process.exit(1)"; then
                retailer_ok=1
                break
              fi
              sleep 3
            done
            test "$retailer_ok" -eq 1 || { echo "::error::Retailer API failed verification for $slug."; exit 1; }
          done

          unknown_code="$(curl --silent --show-error --output /tmp/retailer-unknown.json --write-out '%{http_code}' --max-time 20 https://badawifour.com/api/retailer/unknown)"
          test "$unknown_code" = "404" || { echo "::error::Unknown retailer slug did not return 404."; exit 1; }

          redirect_ok=0
          for i in {1..6}; do
            curl --silent --show-error --head --max-time 20 https://www.badawifour.com/fr/ > /tmp/www-headers.txt || true
            if grep -qi '^location: https://badawifour.com/fr/' /tmp/www-headers.txt; then redirect_ok=1; break; fi
            sleep 3
          done
          test "$redirect_ok" -eq 1 || { echo "::error::www canonical redirect failed verification."; exit 1; }

          curl --silent --show-error --head --max-time 20 https://badawifour.com/fr/ > /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt

          # Legacy/support aliases must redirect to their canonical pages.
          curl --silent --show-error --head --max-time 20 https://badawifour.com/fr/support/assistance/ > /tmp/alias-support.txt
          grep -qi '^location: https://badawifour.com/fr/support/request/' /tmp/alias-support.txt
          curl --silent --show-error --head --max-time 20 https://badawifour.com/en/support/guides/cleaning/ > /tmp/alias-cleaning.txt
          grep -qi '^location: https://badawifour.com/en/support/guides/clean-inox-glass/' /tmp/alias-cleaning.txt

          # Exercise every production form plus both private upload paths. The
          # generated D1 rows and R2 objects are removed before this step passes.
          registration_ref=''
          support_ref=''
          professional_ref=''
          contact_ref=''

          cleanup_smoke_data() {
            set +e
            cleanup_failed=0
            if [ -n "$registration_ref" ] || [ -n "$support_ref" ]; then
              npx wrangler d1 execute badawifour-prod --remote --json \
                --command="SELECT receipt_key AS object_key FROM registrations WHERE id='$registration_ref' UNION ALL SELECT attachment_key AS object_key FROM support_requests WHERE id='$support_ref';" \
                --config wrangler.deploy.json > /tmp/smoke-uploads.json || cleanup_failed=1
              node -e "const x=require('/tmp/smoke-uploads.json'); for(const batch of x) for(const row of (batch.results||[])) if(row.object_key) console.log(row.object_key)" > /tmp/smoke-upload-keys.txt || cleanup_failed=1
              while IFS= read -r key; do
                [ -n "$key" ] && npx wrangler r2 object delete "badawifour-private-uploads/$key" --remote --force --config wrangler.deploy.json || cleanup_failed=1
              done < /tmp/smoke-upload-keys.txt
            fi
            npx wrangler d1 execute badawifour-prod --remote \
              --command="DELETE FROM registrations WHERE id='$registration_ref'; DELETE FROM support_requests WHERE id='$support_ref'; DELETE FROM professional_leads WHERE id='$professional_ref'; DELETE FROM contact_messages WHERE id='$contact_ref';" \
              --config wrangler.deploy.json > /dev/null || cleanup_failed=1
            set -e
            return "$cleanup_failed"
          }
          trap 'cleanup_smoke_data || true' EXIT

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > /tmp/badawi-smoke.png
          started_at="$(node -p 'Date.now()-2500')"

          curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://badawifour.com' \
            -H 'Referer: https://badawifour.com/en/support/register/' \
            -H 'Accept: application/json' \
            -F 'locale=en' -F 'website=' -F "started_at=$started_at" \
            -F 'first_name=BADAWI' -F 'last_name=Deployment Smoke Test' \
            -F 'phone=+212600000000' -F 'email=smoke@badawifour.invalid' \
            -F 'model=BF65CINOX' -F 'serial_number=SMOKE-TEST' \
            -F 'retailer=Automated production verification' \
            -F 'privacy_consent=1' -F 'receipt=@/tmp/badawi-smoke.png;type=image/png' \
            https://badawifour.com/api/registration > /tmp/registration-smoke.json
          registration_ref="$(node -e "const x=require('/tmp/registration-smoke.json'); if(!x.ok||!x.reference) process.exit(1); process.stdout.write(x.reference)")"

          curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://badawifour.com' \
            -H 'Referer: https://badawifour.com/en/support/request/' \
            -H 'Accept: application/json' \
            -F 'locale=en' -F 'website=' -F "started_at=$started_at" \
            -F 'name=BADAWI Deployment Smoke Test' -F 'phone=+212600000000' \
            -F 'email=smoke@badawifour.invalid' -F 'model=BF65INOXP' \
            -F 'serial_number=SMOKE-TEST' -F 'category=product' \
            -F 'description=Automated production verification. Safe to delete.' \
            -F 'privacy_consent=1' -F 'attachment=@/tmp/badawi-smoke.png;type=image/png' \
            https://badawifour.com/api/support > /tmp/support-smoke.json
          support_ref="$(node -e "const x=require('/tmp/support-smoke.json'); if(!x.ok||!x.reference) process.exit(1); process.stdout.write(x.reference)")"

          curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://badawifour.com' \
            -H 'Referer: https://badawifour.com/en/professionals/' \
            -H 'Accept: application/json' \
            -F 'locale=en' -F 'website=' -F "started_at=$started_at" \
            -F 'company=BADAWI Deployment Smoke Test' -F 'contact_name=Automation' \
            -F 'country=Morocco' -F 'phone=+212600000000' \
            -F 'email=smoke@badawifour.invalid' -F 'business_type=retailer' \
            -F 'message=Automated production verification. Safe to delete.' \
            -F 'privacy_consent=1' \
            https://badawifour.com/api/professionals > /tmp/professionals-smoke.json
          professional_ref="$(node -e "const x=require('/tmp/professionals-smoke.json'); if(!x.ok||!x.reference) process.exit(1); process.stdout.write(x.reference)")"

          curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://badawifour.com' \
            -H 'Referer: https://badawifour.com/en/contact/' \
            -H 'Accept: application/json' \
            -F 'locale=en' -F 'website=' -F "started_at=$started_at" \
            -F 'name=BADAWI Deployment Smoke Test' -F 'email=smoke@badawifour.invalid' \
            -F 'subject=Production form smoke test' \
            -F 'message=Automated production verification. Safe to delete.' \
            -F 'privacy_consent=1' \
            https://badawifour.com/api/contact > /tmp/contact-smoke.json
          contact_ref="$(node -e "const x=require('/tmp/contact-smoke.json'); if(!x.ok||!x.reference) process.exit(1); process.stdout.write(x.reference)")"

          cleanup_smoke_data
          trap - EXIT
          echo "Production registration, support, professional and contact flows passed; D1 rows and R2 objects were cleaned up."

      - name: Enforce production Lighthouse quality
        env:
          LIGHTHOUSE_STRICT: "1"
          LIGHTHOUSE_RUNS: "3"
        run: npm run audit:prod
